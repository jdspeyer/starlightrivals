  <main class="mc-main">
    <section class="mc-hero">
      <div class="hero__video-wrap" aria-hidden="true">
        <div class="hero__video" id="mcHeroVideo"></div>
        <div class="hero__video-overlay"></div>
      </div>
      <div class="container mc-hero__inner">
        <div class="mc-hero__pack glass-card">
          <img src="assets/cobbleverse-starlight.png" alt="" class="mc-hero__logo" id="mcPackLogo" width="88" height="88">
          <div class="mc-hero__pack-text">
            <span class="section__label" id="mcPackLabel">current pack</span>
            <h1 class="mc-hero__title" id="mcPackName">cobbleverse x starlight</h1>
            <p class="mc-hero__desc" id="mcPackDesc"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="section mc-guide" id="setupGuide">
      <div class="container">
        <p class="mc-guide__sub reveal-up" id="mcGuideSub"></p>
        <ol class="mc-guide__steps" id="mcGuideSteps"></ol>
      </div>
    </section>

    <section class="section mc-map" id="worldMap">
      <div class="container">
        <header class="section__header">
          <span class="section__label">live view</span>
          <h2 class="section__title">world map</h2>
        </header>
        <div class="map-frame glass-card" id="mapFrame">
          <div class="map-frame__toolbar">
            <span class="map-frame__dot map-frame__dot--live"></span>
            <span id="mapStatus">map preview</span>
          </div>
          <div class="map-frame__viewport" id="mapViewport">
            <div class="map-placeholder" id="mapPlaceholder">
              <div class="map-placeholder__grid" aria-hidden="true"></div>
              <p id="mapPlaceholderText">map coming soon…</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="mobile-cta visible" id="mobileCta">
    <a href="#" class="btn btn--discord btn--block magnetic" id="mobileDiscordCta" data-magnetic>join discord</a>
  </div>
