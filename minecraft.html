<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Starlight Rivals modded Minecraft server — seasons, modpacks, and world map. Collab with Nuggie Kingdom.">
  <meta name="theme-color" content="#7c3aed">
  <title>World Map — Starlight Rivals</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/minecraft-page.css">
</head>
<body class="map-page loaded">
  <!-- Navigation (matches landing page) -->
  <header class="nav scrolled" id="nav">
    <a href="index.html" class="nav__brand">
      <img src="assets/logo.png" alt="Starlight Rivals" class="logo-img" width="36" height="36">
      <span class="nav__name">Starlight Rivals</span>
    </a>
    <button class="nav__toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span>
    </button>
  </header>
  <div class="nav__overlay" id="navOverlay" aria-hidden="true"></div>
  <nav class="nav__links" id="navLinks">
    <a href="index.html#about" class="nav__link">About</a>
    <a href="index.html#oli" class="nav__link">Founder</a>
    <a href="index.html#discord" class="nav__link">Discord</a>
    <a href="minecraft.html" class="nav__link">Minecraft</a>
    <a href="#" class="nav__cta btn btn--discord" id="navDiscordCta">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
      Join Discord
    </a>
  </nav>

  <main class="map-main">
    <div class="map-hero">
      <span class="section__label">Side quest</span>
      <h1 class="map-hero__title" id="mapHeadline">Modded Minecraft</h1>
      <p class="map-hero__sub" id="mapSub"></p>
    </div>

    <div class="map-info glass-card">
      <div class="minecraft__status" id="mapServerStatus">
        <span class="minecraft__status-pulse"></span>
        <span id="mapStatusText"></span>
      </div>
      <ol class="minecraft__steps" id="mapSteps"></ol>
      <div class="map-info__actions">
        <a href="#" class="btn btn--discord" id="mapDiscordCta">Server info on Discord</a>
        <a href="index.html" class="btn btn--ghost">Back to home</a>
      </div>
      <footer class="minecraft__footer">
        <span class="minecraft__footer-label">In collab with</span>
        <a href="#" class="minecraft__nk-link" id="mapNkLink" target="_blank" rel="noopener noreferrer">
          <img src="assets/nuggie-kingdom.png" alt="Nuggie Kingdom" id="mapNkLogo" width="120" height="32">
        </a>
      </footer>
    </div>

    <div class="map-section">
      <h2 class="map-section__title">World Map</h2>
      <p class="map-section__sub">Explore the realm when a season's live.</p>
    </div>

    <div class="map-frame glass-card" id="mapFrame">
      <div class="map-frame__toolbar">
        <span class="map-frame__dot map-frame__dot--live"></span>
        <span id="mapStatus">Map preview</span>
      </div>
      <div class="map-frame__viewport" id="mapViewport">
        <div class="map-placeholder" id="mapPlaceholder">
          <div class="map-placeholder__grid" aria-hidden="true"></div>
          <p id="mapPlaceholderText">Map coming soon…</p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/discord-gate.js"></script>
  <script src="js/minecraft-page.js"></script>
</body>
</html>
